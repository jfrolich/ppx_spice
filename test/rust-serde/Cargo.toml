# Writes ../fixtures/serde-rust.json: what Rust's serde derive produces for
# the types in ../src/SerdeRust.res. Regenerate with `cargo run`.
[package]
name = "spice-serde-golden"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

